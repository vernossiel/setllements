name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (Forge)
        run: ./gradlew :forge:build --console=plain --non-interactive --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: settlements-forge-jar
          path: forge/build/libs/*.jar
          if-no-files-found: error

name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build (Forge)
        run: ./gradlew :forge:build --console=plain --non-interactive --stacktrace

      - name: Inspect jars
        run: |
          ls -la forge/build/libs
          for f in forge/build/libs/*.jar; do
            echo "=== $f"
            unzip -l "$f" | grep -E "META-INF/mods.toml|pack.mcmeta|mca.mixin.json|net/mca/MCA.class|net/mca/forge/MCAForge.class" || true
            echo "--- mods.toml"
            unzip -p "$f" META-INF/mods.toml 2>/dev/null | head -30 || true
            echo "--- manifest"
            unzip -p "$f" META-INF/MANIFEST.MF 2>/dev/null | head -20 || true
            echo "--- sample class names"
            unzip -l "$f" | grep -E "net/mca/entity/VillagerEntityMCA.class" || true
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: settlements-forge-jar
          path: |
            forge/build/libs/*.jar
            !forge/build/libs/*-dev-shadow.jar
            !forge/build/libs/*-sources.jar
          if-no-files-found: error

      - name: Day test (a village through a working day on a server)
        timeout-minutes: 25
        run: |
          mkdir -p forge/run
          echo "eula=true" > forge/run/eula.txt
          printf 'online-mode=false\nlevel-name=daytest\nlevel-seed=12345\nspawn-protection=0\nview-distance=6\nsimulation-distance=6\nenable-rcon=true\nrcon.port=25575\nrcon.password=test\nmax-tick-time=-1\n' > forge/run/server.properties
          (./gradlew :forge:runServer --args=nogui --console=plain > server.log 2>&1 &)
          python3 scripts/daytest.py 24 | tee daytest.log
          sleep 10
          grep -a -i "exception" server.log | grep -v -i "authlib\|yggdrasil\|minecraftservices\|UnknownHost" | head -20 || true

      - name: Upload day test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daytest-log
          path: |
            daytest.log
            server.log
          if-no-files-found: ignore

